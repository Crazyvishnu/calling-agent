# Private localhost HTTPS; internal CA trust is required. No public DNS/ACME service.
services:
  app:
    environment:
      AKKI_SECURE_COOKIES: "1"
      AKKI_ALLOWED_ORIGINS: https://localhost:8443
  https:
    image: caddy:2.10-alpine
    environment:
      NO_PROXY: app,localhost,127.0.0.1
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
